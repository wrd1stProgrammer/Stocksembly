AWSTemplateFormatVersion: "2010-09-09"
Description: Low-cost Stocksembly production foundation for the AWS sandbox.

Parameters:
  AdminCidr:
    Type: String
    Description: IPv4 CIDR allowed to SSH to the application host.
    AllowedPattern: "^(?:[0-9]{1,3}\\.){3}[0-9]{1,3}/(?:[0-9]|[12][0-9]|3[0-2])$"
  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 key pair used by the application host.
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  Network:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.24.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: stocksembly-sandbox
        - Key: Project
          Value: Stocksembly

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: stocksembly-sandbox

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref Network

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Network
      Tags:
        - Key: Name
          Value: stocksembly-public

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.24.1.0/24
      MapPublicIpOnLaunch: true
      VpcId: !Ref Network
      Tags:
        - Key: Name
          Value: stocksembly-public-a

  PublicSubnetC:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: 10.24.2.0/24
      MapPublicIpOnLaunch: true
      VpcId: !Ref Network
      Tags:
        - Key: Name
          Value: stocksembly-public-c

  PublicSubnetARoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetA

  PublicSubnetCRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetC

  ApplicationSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Stocksembly HTTP, HTTPS, and restricted SSH
      SecurityGroupIngress:
        - CidrIp: !Ref AdminCidr
          Description: Restricted administrator SSH
          FromPort: 22
          IpProtocol: tcp
          ToPort: 22
        - CidrIp: 0.0.0.0/0
          Description: Public HTTP
          FromPort: 80
          IpProtocol: tcp
          ToPort: 80
        - CidrIp: 0.0.0.0/0
          Description: Public HTTPS
          FromPort: 443
          IpProtocol: tcp
          ToPort: 443
      VpcId: !Ref Network
      Tags:
        - Key: Name
          Value: stocksembly-app

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL access from the Stocksembly application host
      SecurityGroupIngress:
        - Description: PostgreSQL from application security group
          FromPort: 5432
          IpProtocol: tcp
          SourceSecurityGroupId: !Ref ApplicationSecurityGroup
          ToPort: 5432
      VpcId: !Ref Network
      Tags:
        - Key: Name
          Value: stocksembly-db

  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      BucketName: !Sub stocksembly-prod-${AWS::AccountId}-${AWS::Region}
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Project
          Value: Stocksembly

  ResearchDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      KmsMasterKeyId: alias/aws/sqs
      MessageRetentionPeriod: 1209600
      QueueName: stocksembly-research-prod-dlq
      Tags:
        - Key: Project
          Value: Stocksembly

  ResearchQueue:
    Type: AWS::SQS::Queue
    Properties:
      KmsMasterKeyId: alias/aws/sqs
      MessageRetentionPeriod: 345600
      QueueName: stocksembly-research-prod
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ResearchDeadLetterQueue.Arn
        maxReceiveCount: 3
      VisibilityTimeout: 900
      Tags:
        - Key: Project
          Value: Stocksembly

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AutoVerifiedAttributes:
        - email
      DeletionProtection: INACTIVE
      MfaConfiguration: "OFF"
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
          TemporaryPasswordValidityDays: 7
      UserPoolName: stocksembly-prod-users
      UsernameAttributes:
        - email
      UserPoolTags:
        Project: Stocksembly

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      AccessTokenValidity: 60
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - email
        - openid
        - profile
      CallbackURLs:
        - https://stocksembly.com/auth/callback
        - https://www.stocksembly.com/auth/callback
        - http://localhost:3000/auth/callback
        - http://localhost:3001/auth/callback
      ClientName: stocksembly-web
      EnableTokenRevocation: true
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      GenerateSecret: false
      IdTokenValidity: 60
      LogoutURLs:
        - https://stocksembly.com/login
        - https://www.stocksembly.com/login
        - http://localhost:3000/login
        - http://localhost:3001/login
      PreventUserExistenceErrors: ENABLED
      RefreshTokenValidity: 30
      SupportedIdentityProviders:
        - COGNITO
        - Google
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      UserPoolId: !Ref UserPool

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Stocksembly database subnets
      SubnetIds:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetC
      Tags:
        - Key: Name
          Value: stocksembly-db

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      AllocatedStorage: 20
      AutoMinorVersionUpgrade: true
      BackupRetentionPeriod: 7
      CopyTagsToSnapshot: true
      DBInstanceClass: db.t4g.micro
      DBInstanceIdentifier: stocksembly-prod
      DBName: stocksembly
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      DeletionProtection: false
      EnablePerformanceInsights: false
      Engine: postgres
      ManageMasterUserPassword: true
      MasterUsername: stocksembly_admin
      MaxAllocatedStorage: 100
      MultiAZ: false
      Port: 5432
      PubliclyAccessible: false
      StorageEncrypted: true
      StorageType: gp3
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup
      Tags:
        - Key: Project
          Value: Stocksembly

  ApplicationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      Description: Runtime permissions for the Stocksembly application host
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: stocksembly-runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:PutObject
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub ${ArtifactBucket.Arn}/*
              - Effect: Allow
                Action:
                  - sqs:ChangeMessageVisibility
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:GetQueueUrl
                  - sqs:ReceiveMessage
                  - sqs:SendMessage
                Resource:
                  - !GetAtt ResearchQueue.Arn
                  - !GetAtt ResearchDeadLetterQueue.Arn
              - Effect: Allow
                Action:
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetSecretValue
                Resource: !GetAtt Database.MasterUserSecret.SecretArn
      Tags:
        - Key: Project
          Value: Stocksembly

  ApplicationInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref ApplicationRole

  ApplicationInstance:
    Type: AWS::EC2::Instance
    DependsOn: PublicRoute
    Properties:
      AvailabilityZone: !Select [0, !GetAZs ""]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            DeleteOnTermination: true
            Encrypted: true
            VolumeSize: 50
            VolumeType: gp3
      IamInstanceProfile: !Ref ApplicationInstanceProfile
      ImageId: !Ref LatestAmiId
      InstanceType: t3.large
      KeyName: !Ref KeyPairName
      MetadataOptions:
        HttpEndpoint: enabled
        HttpPutResponseHopLimit: 1
        HttpTokens: required
      SecurityGroupIds:
        - !Ref ApplicationSecurityGroup
      SubnetId: !Ref PublicSubnetA
      Tags:
        - Key: Name
          Value: stocksembly-prod
        - Key: Project
          Value: Stocksembly
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          dnf update -y
          dnf install -y docker gcc-c++ git make nginx python3 tar gzip
          systemctl enable --now docker
          systemctl enable --now nginx
          usermod -aG docker ec2-user
          install -d -m 0755 -o ec2-user -g ec2-user /opt/stocksembly
          install -d -m 0700 -o ec2-user -g ec2-user /var/lib/stocksembly/research
          install -d -m 0700 -o root -g root /etc/stocksembly
          curl -fsSL https://rpm.nodesource.com/setup_20.x | bash -
          dnf install -y nodejs
          corepack enable
          sudo -u ec2-user bash -lc 'curl -fsSL https://chatgpt.com/codex/install.sh | sh'
          cat >/etc/nginx/conf.d/stocksembly.conf <<'NGINX'
          server {
            listen 80 default_server;
            server_name stocksembly.internal;
            client_max_body_size 20m;
            location / {
              proxy_pass http://127.0.0.1:3000;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Host $host;
              proxy_set_header X-Forwarded-Port $server_port;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
            }
          }
          NGINX
          rm -f /etc/nginx/conf.d/default.conf
          nginx -t
          systemctl reload nginx
          cat >/etc/stocksembly/aws.env <<ENV
          AWS_REGION=${AWS::Region}
          STOCKSEMBLY_ARTIFACT_BUCKET=${ArtifactBucket}
          STOCKSEMBLY_RESEARCH_QUEUE_URL=${ResearchQueue}
          STOCKSEMBLY_COGNITO_USER_POOL_ID=${UserPool}
          STOCKSEMBLY_COGNITO_CLIENT_ID=${UserPoolClient}
          STOCKSEMBLY_DB_SECRET_ARN=${Database.MasterUserSecret.SecretArn}
          STOCKSEMBLY_DATA_DIR=/var/lib/stocksembly/research
          ENV
          chmod 0600 /etc/stocksembly/aws.env

  ApplicationAddress:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      InstanceId: !Ref ApplicationInstance
      Tags:
        - Key: Name
          Value: stocksembly-prod

Outputs:
  ApplicationInstanceId:
    Value: !Ref ApplicationInstance
  ApplicationPublicIp:
    Value: !Ref ApplicationAddress
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
  CognitoClientId:
    Value: !Ref UserPoolClient
  CognitoUserPoolId:
    Value: !Ref UserPool
  CognitoDomain:
    Value: !Sub "stocksembly-prod-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com"
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  DatabaseSecretArn:
    Value: !GetAtt Database.MasterUserSecret.SecretArn
  ResearchDeadLetterQueueUrl:
    Value: !Ref ResearchDeadLetterQueue
  ResearchQueueUrl:
    Value: !Ref ResearchQueue

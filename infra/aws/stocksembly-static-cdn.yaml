AWSTemplateFormatVersion: "2010-09-09"
Description: Pay-as-you-go CloudFront for public office assets. Monthly budget target USD 10; not a hard cap.
Parameters:
  BudgetEmail:
    Type: String
    NoEcho: true
    Description: Email address for monthly CloudFront and S3 cost alerts
    AllowedPattern: '[^@\s]+@[^@\s]+\.[^@\s]+'
Resources:
  CostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub '${AWS::StackName}-monthly'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 10
          Unit: USD
        CostFilters:
          Service: [Amazon CloudFront, Amazon Simple Storage Service]
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
  AssetBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
  OriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-assets'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  PublicAssetCors:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-public-asset-cors'
      AutoPublish: true
      FunctionConfig:
        Comment: Consistent CORS headers for public canvas images, including cached non-CORS requests.
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var response = event.response;
          response.headers['access-control-allow-origin'] = { value: '*' };
          response.headers['timing-allow-origin'] = { value: '*' };
          return response;
        }
  Distribution:
    Type: AWS::CloudFront::Distribution
    DependsOn: CostBudget
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Public office images only; no application or research API origin
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_All
        Origins:
          - Id: assets
            DomainName: !GetAtt AssetBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccess.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: assets
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: e61eb60c-9c35-4d20-a928-2b84e02af89c
          FunctionAssociations:
            - EventType: viewer-response
              FunctionARN: !GetAtt PublicAssetCors.FunctionARN
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
  AssetPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AssetBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${AssetBucket.Arn}/releases/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt AssetBucket.Arn
              - !Sub '${AssetBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false
Outputs:
  BucketName:
    Value: !Ref AssetBucket
  DistributionId:
    Value: !Ref Distribution
  CdnOrigin:
    Value: !Sub 'https://${Distribution.DomainName}'

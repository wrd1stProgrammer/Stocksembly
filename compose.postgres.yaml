services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: stocksembly
      POSTGRES_PASSWORD: stocksembly_local
      POSTGRES_DB: stocksembly
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - stocksembly-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocksembly -d stocksembly"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  stocksembly-postgres:

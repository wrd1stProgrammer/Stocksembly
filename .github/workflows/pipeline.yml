name: CI and production deployment

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      static_asset_release:
        description: Existing published CloudFront asset release SHA for the build-only image
        required: true
        default: 757f97fb31bdf361ecc973969ea332a65877b658

permissions:
  contents: read

concurrency:
  group: stocksembly-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stocksembly
          POSTGRES_PASSWORD: stocksembly_ci
          POSTGRES_DB: stocksembly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stocksembly -d stocksembly_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      STOCKSEMBLY_RESEARCH_POSTGRES_READY: "true"
      STOCKSEMBLY_TEST_DATABASE_URL: postgres://stocksembly:stocksembly_ci@127.0.0.1:5432/stocksembly_test
      STOCKSEMBLY_DATABASE_URL: postgres://stocksembly:stocksembly_ci@127.0.0.1:5432/stocksembly_test
    outputs:
      production_change: ${{ steps.production_change.outputs.required }}
      runtime_roles: ${{ steps.runtime_roles.outputs.roles }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect production changes
        id: production_change
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: echo "required=$(bash scripts/ci-production-change.sh "$BASE_SHA")" >> "$GITHUB_OUTPUT"
      - name: Select changed runtimes
        id: runtime_roles
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: echo "roles=$(bash scripts/ci-runtime-roles.sh "$BASE_SHA")" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.1
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify deterministic research quality fixtures
        run: pnpm research:quality
      - name: Verify focused research contracts
        run: pnpm research:quality:contracts
      - name: Verify CloudFront deployment shell syntax
        run: bash scripts/ci-static-assets-workflow.test.sh
      - name: Verify static asset routing and fallback
        run: pnpm exec vitest run src/lib/staticAsset.test.ts src/research/officeMotion/canvasPrimitives.assets.test.ts
      - name: Verify PostgreSQL public catalogs
        env:
          STOCKSEMBLY_API_TEST_DATABASE_URL: postgres://stocksembly:stocksembly_ci@127.0.0.1:5432/stocksembly_test
        run: pnpm exec vitest run src/research/server/researchRoom/researchRoomCatalog.test.ts src/research/server/researchRoom/stockResearchHubCatalog.test.ts
      - name: Verify Bash 3 changed-file lint portability
        run: /bin/bash scripts/ci-lint-changed.test.sh
      - name: Verify production change classification
        run: /bin/bash scripts/ci-production-change.test.sh
      - run: pnpm typecheck
      - name: Lint changed files
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/ci-lint-changed.sh "$BASE_SHA"
      - run: pnpm build:web
      - run: pnpm build:worker
      - name: Verify packaged research worker startup
        working-directory: .stocksembly-verification/worker-runtime
        env:
          STOCKSEMBLY_DATA_DIR: ${{ runner.temp }}/stocksembly-worker-smoke
        run: |
          mkdir -p "$STOCKSEMBLY_DATA_DIR"
          node --input-type=module -e "await Promise.all([import('./research-worker/leaseWorker.js'), import('./briefing-worker/briefingWorker.js')])"
          node research-worker/worker.mjs readiness

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.quality.outputs.production_change == 'true'
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        role: ${{ fromJSON(needs.quality.outputs.runtime_roles) }}
    concurrency:
      group: production-${{ matrix.role }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: stocksembly
      INSTANCE_ID: ${{ matrix.role == 'web' && vars.WEB_INSTANCE_ID || vars.WORKER_INSTANCE_ID }}
      RUNTIME_ROLE: ${{ matrix.role }}
      WEB_ASG_NAME: ${{ vars.WEB_ASG_NAME }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.1
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Resolve current deployment instances
        run: |
          if [[ "$RUNTIME_ROLE" == web && -n "$WEB_ASG_NAME" ]]; then
            ids="$(aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names "$WEB_ASG_NAME" --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`].InstanceId' --output text)"
          else
            ids="$INSTANCE_ID"
          fi
          [[ "$ids" =~ ^i- ]] || { echo 'No serving instances resolved' >&2; exit 78; }
          echo "INSTANCE_IDS=$ids" >> "$GITHUB_ENV"
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Publish optional CloudFront office assets
        if: matrix.role == 'web'
        env:
          STATIC_ASSET_BUCKET: ${{ vars.STATIC_ASSET_BUCKET }}
          STATIC_CDN_ORIGIN: ${{ vars.STATIC_CDN_ORIGIN }}
        run: |
          if [[ -z "$STATIC_ASSET_BUCKET" && -z "$STATIC_CDN_ORIGIN" ]]; then
            echo "NEXT_PUBLIC_STATIC_ASSET_BASE_URL=" >> "$GITHUB_ENV"
          else
            [[ -n "$STATIC_ASSET_BUCKET" && "$STATIC_CDN_ORIGIN" =~ ^https://[a-z0-9]+\.cloudfront\.net$ ]] || {
              echo "Configure both STATIC_ASSET_BUCKET and STATIC_CDN_ORIGIN" >&2
              exit 1
            }
            bash scripts/publish-static-assets.sh "$STATIC_ASSET_BUCKET" "$GITHUB_SHA"
            asset_base="$STATIC_CDN_ORIGIN/releases/$GITHUB_SHA"
            curl --fail --silent --show-error --connect-timeout 10 --max-time 60 --retry 3 --output /dev/null "$asset_base/research/office-v8/base.webp"
            echo "NEXT_PUBLIC_STATIC_ASSET_BASE_URL=$asset_base" >> "$GITHUB_ENV"
          fi
      - name: Build and push immutable image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          COGNITO_USER_POOL_ID: us-east-1_aBlbfohE8
          COGNITO_USER_POOL_CLIENT_ID: 5njm1pei6ltopdks0g4a1m5cab
          COGNITO_DOMAIN: stocksembly-prod-359463332817.auth.us-east-1.amazoncognito.com
          APP_ORIGIN: https://stocksembly.com
          GA_MEASUREMENT_ID: G-YRQDC6R5TL
          META_PIXEL_ID: "1941324473216410"
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
        run: |
          image_tag="${RUNTIME_ROLE}-sha-${GITHUB_SHA}"
          image="${REGISTRY}/${ECR_REPOSITORY}:${image_tag}"
          if aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=${image_tag}" >/dev/null 2>&1; then
            echo "Reusing existing immutable image: $image"
          else
            docker build -f "apps/${RUNTIME_ROLE}/Dockerfile" \
              --build-arg "NEXT_PUBLIC_COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID}" \
              --build-arg "NEXT_PUBLIC_COGNITO_USER_POOL_CLIENT_ID=${COGNITO_USER_POOL_CLIENT_ID}" \
              --build-arg "NEXT_PUBLIC_COGNITO_DOMAIN=${COGNITO_DOMAIN}" \
              --build-arg "NEXT_PUBLIC_APP_ORIGIN=${APP_ORIGIN}" \
              --build-arg "NEXT_PUBLIC_GA_MEASUREMENT_ID=${GA_MEASUREMENT_ID}" \
              --build-arg "NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN:-}" \
              --build-arg "NEXT_PUBLIC_META_PIXEL_ID=${META_PIXEL_ID}" \
              --build-arg "NEXT_PUBLIC_STATIC_ASSET_BASE_URL=${NEXT_PUBLIC_STATIC_ASSET_BASE_URL:-}" \
              --tag "$image" .
            if ! push_output="$(docker push "$image" 2>&1)"; then
              echo "$push_output"
              if grep -Fq "cannot be overwritten because the tag is immutable" <<<"$push_output"; then
                echo "Reusing existing immutable image after concurrent push: $image"
              else
                exit 1
              fi
            else
              echo "$push_output"
            fi
          fi
          echo "image=$image" >> "$GITHUB_ENV"
      - name: Sync provider environment
        env:
          INSIGHTSENTRY_RAPIDAPI_HOST: ${{ secrets.INSIGHTSENTRY_RAPIDAPI_HOST }}
          INSIGHTSENTRY_RAPIDAPI_KEY: ${{ secrets.INSIGHTSENTRY_RAPIDAPI_KEY }}
          WHOP_API_BASE: ${{ secrets.WHOP_API_BASE }}
          WHOP_API_KEY: ${{ secrets.WHOP_API_KEY }}
          WHOP_COMPANY_ID: ${{ secrets.WHOP_COMPANY_ID }}
          WHOP_PLAN_PRO_ANNUAL_ID: ${{ secrets.WHOP_PLAN_PRO_ANNUAL_ID }}
          WHOP_PLAN_PRO_MONTHLY_ID: ${{ secrets.WHOP_PLAN_PRO_MONTHLY_ID }}
          WHOP_PLAN_PRO_MONTHLY_LIVE_TEST_ID: ${{ secrets.WHOP_PLAN_PRO_MONTHLY_LIVE_TEST_ID }}
          WHOP_PLAN_ULTRA_ANNUAL_ID: ${{ secrets.WHOP_PLAN_ULTRA_ANNUAL_ID }}
          WHOP_PLAN_ULTRA_MONTHLY_ID: ${{ secrets.WHOP_PLAN_ULTRA_MONTHLY_ID }}
          WHOP_PRODUCT_ID: ${{ secrets.WHOP_PRODUCT_ID }}
          WHOP_SANDBOX: ${{ secrets.WHOP_SANDBOX }}
          WHOP_WEBHOOK_SECRET: ${{ secrets.WHOP_WEBHOOK_SECRET }}
          META_CONVERSIONS_API_ACCESS_TOKEN: ${{ secrets.META_CONVERSIONS_API_ACCESS_TOKEN }}
          META_GRAPH_API_VERSION: v25.0
          META_PIXEL_ID: "1941324473216410"
        run: |
          provider_env="$(printf '%s\n' \
            "INSIGHTSENTRY_RAPIDAPI_HOST=$INSIGHTSENTRY_RAPIDAPI_HOST" \
            "INSIGHTSENTRY_RAPIDAPI_KEY=$INSIGHTSENTRY_RAPIDAPI_KEY" \
            "WHOP_API_BASE=$WHOP_API_BASE" \
            "WHOP_API_KEY=$WHOP_API_KEY" \
            "WHOP_COMPANY_ID=$WHOP_COMPANY_ID" \
            "WHOP_PLAN_PRO_ANNUAL_ID=$WHOP_PLAN_PRO_ANNUAL_ID" \
            "WHOP_PLAN_PRO_MONTHLY_ID=$WHOP_PLAN_PRO_MONTHLY_ID" \
            "WHOP_PLAN_PRO_MONTHLY_LIVE_TEST_ID=$WHOP_PLAN_PRO_MONTHLY_LIVE_TEST_ID" \
            "WHOP_PLAN_ULTRA_ANNUAL_ID=$WHOP_PLAN_ULTRA_ANNUAL_ID" \
            "WHOP_PLAN_ULTRA_MONTHLY_ID=$WHOP_PLAN_ULTRA_MONTHLY_ID" \
            "WHOP_PRODUCT_ID=$WHOP_PRODUCT_ID" \
            "WHOP_SANDBOX=$WHOP_SANDBOX" \
            "WHOP_WEBHOOK_SECRET=$WHOP_WEBHOOK_SECRET" \
            "META_CONVERSIONS_API_ACCESS_TOKEN=$META_CONVERSIONS_API_ACCESS_TOKEN" \
            "META_GRAPH_API_VERSION=$META_GRAPH_API_VERSION" \
            "META_PIXEL_ID=$META_PIXEL_ID")"
          encoded_provider_env="$(printf '%s' "$provider_env" | base64 -w 0)"
          parameters="$(jq -nc \
            --arg command "sudo install -d -m 0700 /etc/stocksembly && sudo touch /etc/stocksembly/app.env && sudo chmod 0600 /etc/stocksembly/app.env && sudo sed -i -e '/^WHOP_/d' -e '/^INSIGHTSENTRY_/d' -e '/^META_/d' /etc/stocksembly/app.env && printf '%s' '${encoded_provider_env}' | base64 --decode | sudo tee -a /etc/stocksembly/app.env >/dev/null" \
            '{commands:[$command]}')"
          jq '. + {executionTimeout:["2400"]}' <<< "$parameters" > "$RUNNER_TEMP/provider-parameters.json"
          bash infra/aws/run-ssm-fleet.sh "$RUNNER_TEMP/provider-parameters.json"
      - name: Install daily Docker maintenance
        run: |
          maintenance="$(base64 -w 0 infra/aws/docker-maintenance.sh)"
          installer="$(base64 -w 0 infra/aws/install-docker-maintenance.sh)"
          jq -nc --arg command "sudo install -d -m 0700 /opt/stocksembly/maintenance && printf '%s' '$maintenance' | base64 --decode | sudo tee /opt/stocksembly/maintenance/docker-maintenance.sh >/dev/null && printf '%s' '$installer' | base64 --decode | sudo tee /opt/stocksembly/maintenance/install-docker-maintenance.sh >/dev/null && sudo bash /opt/stocksembly/maintenance/install-docker-maintenance.sh" '{commands:[$command],executionTimeout:["120"]}' > "$RUNNER_TEMP/maintenance-parameters.json"
          bash infra/aws/run-ssm-fleet.sh "$RUNNER_TEMP/maintenance-parameters.json"
      - name: Configure Sentry runtime
        env:
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
        run: |
          encoded="$(printf '%s\n' "SENTRY_DSN=$SENTRY_DSN" "SENTRY_RELEASE=$GITHUB_SHA" | base64 -w 0)"
          jq -nc --arg command "sudo sed -i -e '/^SENTRY_DSN=/d' -e '/^SENTRY_RELEASE=/d' /etc/stocksembly/app.env && printf '%s' '$encoded' | base64 --decode | sudo tee -a /etc/stocksembly/app.env >/dev/null" '{commands:[$command],executionTimeout:["120"]}' > "$RUNNER_TEMP/sentry-parameters.json"
          bash infra/aws/run-ssm-fleet.sh "$RUNNER_TEMP/sentry-parameters.json"
      - name: Deploy through Systems Manager
        run: |
          deploy_script="$(base64 -w 0 infra/aws/role-deploy.sh)"
          parameters="$(
            jq -nc \
              --arg command "sudo sed -i -e '/^STOCKSEMBLY_ADMIN_ANALYTICS_READS_ENABLED=/d' -e '/^STOCKSEMBLY_ADMIN_ANALYTICS_WRITES_ENABLED=/d' /etc/stocksembly/aws.env && printf '%s\\n' 'STOCKSEMBLY_ADMIN_ANALYTICS_READS_ENABLED=true' 'STOCKSEMBLY_ADMIN_ANALYTICS_WRITES_ENABLED=true' | sudo tee -a /etc/stocksembly/aws.env >/dev/null && printf '%s' '${deploy_script}' | base64 --decode | sudo tee /usr/local/bin/stocksembly-role-deploy >/dev/null && sudo chmod 0755 /usr/local/bin/stocksembly-role-deploy && sudo /usr/local/bin/stocksembly-role-deploy ${RUNTIME_ROLE} ${image}" \
              '{commands:[$command]}'
          )"
          jq '. + {executionTimeout:["2400"]}' <<< "$parameters" > "$RUNNER_TEMP/deploy-parameters.json"
          bash infra/aws/run-ssm-fleet.sh "$RUNNER_TEMP/deploy-parameters.json" deploy
      - name: Advance the web bootstrap release after successful rollout
        if: matrix.role == 'web' && env.WEB_ASG_NAME != ''
        run: |
          aws s3 cp infra/aws/role-deploy.sh s3://stocksembly-prod-359463332817-us-east-1/operations/web/role-deploy.sh --only-show-errors
          aws s3 cp infra/aws/web-asg-bootstrap.sh s3://stocksembly-prod-359463332817-us-east-1/operations/web/web-asg-bootstrap.sh --only-show-errors
          aws s3 cp infra/aws/docker-maintenance.sh s3://stocksembly-prod-359463332817-us-east-1/operations/web/docker-maintenance.sh --only-show-errors
          aws s3 cp infra/aws/install-docker-maintenance.sh s3://stocksembly-prod-359463332817-us-east-1/operations/web/install-docker-maintenance.sh --only-show-errors
          aws s3 cp infra/aws/web-alb-nginx.conf s3://stocksembly-prod-359463332817-us-east-1/operations/web/web-alb-nginx.conf --only-show-errors
          aws ssm put-parameter --name /stocksembly/prod/web/image --type String --value "$image" --overwrite

  manual_web_image:
    if: github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build a reviewable web image without deploying
        env:
          STATIC_CDN_ORIGIN: ${{ vars.STATIC_CDN_ORIGIN }}
          STATIC_ASSET_RELEASE: ${{ inputs.static_asset_release }}
        run: |
          [[ "$STATIC_ASSET_RELEASE" =~ ^[a-f0-9]{40}$ ]] || exit 64
          docker build -f apps/web/Dockerfile \
            --build-arg NEXT_PUBLIC_COGNITO_USER_POOL_ID=us-east-1_aBlbfohE8 \
            --build-arg NEXT_PUBLIC_COGNITO_USER_POOL_CLIENT_ID=5njm1pei6ltopdks0g4a1m5cab \
            --build-arg NEXT_PUBLIC_COGNITO_DOMAIN=stocksembly-prod-359463332817.auth.us-east-1.amazoncognito.com \
            --build-arg NEXT_PUBLIC_APP_ORIGIN=https://stocksembly.com \
            --build-arg NEXT_PUBLIC_GA_MEASUREMENT_ID=G-YRQDC6R5TL \
            --build-arg NEXT_PUBLIC_SENTRY_DSN="${NEXT_PUBLIC_SENTRY_DSN:-}" \
            --build-arg NEXT_PUBLIC_META_PIXEL_ID=1941324473216410 \
            --build-arg NEXT_PUBLIC_STATIC_ASSET_BASE_URL="$STATIC_CDN_ORIGIN/releases/$STATIC_ASSET_RELEASE" \
            -t "stocksembly-web:$GITHUB_SHA" .
          docker save "stocksembly-web:$GITHUB_SHA" | gzip > web-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: web-image-${{ github.sha }}
          path: web-image.tar.gz
          retention-days: 3

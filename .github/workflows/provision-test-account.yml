name: Provision test account

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_REGION: us-east-1
      COGNITO_USER_POOL_ID: us-east-1_aBlbfohE8
      INSTANCE_ID: i-030eacac11712c94d
      TEST_ACCOUNT_EMAIL: ${{ secrets.STOCKSEMBLY_TEST_ACCOUNT_EMAIL }}
      TEST_ACCOUNT_PASSWORD: ${{ secrets.STOCKSEMBLY_TEST_ACCOUNT_PASSWORD }}
      TEST_ACCOUNT_SUBJECT: ${{ secrets.STOCKSEMBLY_TEST_ACCOUNT_SUBJECT }}
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Resolve Cognito test account
        id: cognito
        run: |
          set -euo pipefail
          if [[ -n "$TEST_ACCOUNT_SUBJECT" ]]; then
            subject="$TEST_ACCOUNT_SUBJECT"
          else
            payload="$(jq -nc \
              --arg clientId "5njm1pei6ltopdks0g4a1m5cab" \
              --arg username "$TEST_ACCOUNT_EMAIL" \
              --arg password "$TEST_ACCOUNT_PASSWORD" \
              '{ClientId:$clientId,Username:$username,Password:$password,UserAttributes:[{Name:"email",Value:$username}]}')"
            response="$(curl --fail --silent --show-error \
              -X POST "https://cognito-idp.${AWS_REGION}.amazonaws.com/" \
              -H 'Content-Type: application/x-amz-json-1.1' \
              -H 'X-Amz-Target: AWSCognitoIdentityProviderService.SignUp' \
              --data "$payload")"
            subject="$(printf '%s' "$response" | jq -r '.UserSub // empty')"
          fi
          test -n "$subject"
          printf 'subject=%s\n' "$subject" >> "$GITHUB_OUTPUT"
      - name: Seed 100 credits through Systems Manager
        env:
          TEST_ACCOUNT_SUBJECT: ${{ steps.cognito.outputs.subject }}
        run: |
          set -euo pipefail
          identity_payload="$(printf '%s\n%s' \
            "$TEST_ACCOUNT_SUBJECT" \
            "$TEST_ACCOUNT_EMAIL" | base64 -w 0)"
          seed_script="$(base64 -w 0 infra/aws/provision-test-account.ssm.sh)"
          parameters="$(jq -nc \
            --arg command "printf '%s' '${seed_script}' | base64 --decode | sudo bash -s -- '${identity_payload}'" \
            '{commands:[$command]}')"
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)"
          aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" || true
          invocation="$(aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{status:Status,stdout:StandardOutputContent,stderr:StandardErrorContent}' \
            --output json)"
          printf '%s\n' "$invocation"
          test "$(printf '%s' "$invocation" | jq -r '.status')" = "Success"

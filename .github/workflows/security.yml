name: Security checks
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "21 3 * * 1"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
      - run: pnpm audit --prod --audit-level=high
